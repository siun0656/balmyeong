<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>세종과 장영실: 시간을 만드는 사람들</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#d9b45a;--gold2:#b58a32;--ink:#0a1024;--paper:#f3ead2;--red:#b33a2b;--celadon:#7fb4d6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%}
body{position:relative;background:#04060d;overflow:hidden;color:var(--paper);font-family:"Noto Serif KR","Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:var(--ink);box-shadow:0 0 60px #000}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;touch-action:none;display:block}
#top,#scr,#mission,#panel,#tools,#dlg,#modal,#toast,#coach{position:absolute}
#coach{left:372px;bottom:12px;width:560px;min-height:44px;display:none;padding:9px 16px;background:linear-gradient(#3a2a10ee,#241808ee);border:2px solid #ffd45a;border-radius:14px;font-size:18px;line-height:1.4;text-align:center;box-shadow:0 4px 18px #000a;z-index:15;pointer-events:none}
#scr{inset:0;pointer-events:none}#scr>*{pointer-events:auto}
#top{left:0;right:0;top:0;height:52px;display:none;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(#050816ee,#05081600);pointer-events:none}
#top>*{pointer-events:auto}
#top .lg{font-size:17px;letter-spacing:.08em;color:var(--gold)}
.btn{display:inline-block;padding:9px 16px;margin:4px 3px;background:linear-gradient(#e6c36e,#b58a32);color:#2a1a08;border:1px solid #6e4e12;border-radius:8px;font:700 15px/1.2 inherit;font-family:inherit;cursor:pointer;box-shadow:0 2px 6px #0008}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.sec{background:linear-gradient(#3a4a72,#26335a);color:var(--paper);border-color:#7a8ab8}
.btn.red{background:linear-gradient(#d4553f,#962a1b);color:#fff;border-color:#5c140a}
.btn.sm{padding:5px 10px;font-size:13px}.btn.on{outline:3px solid #fff9}.btn.big{font-size:21px;padding:14px 34px;margin:8px}
.btn:disabled{opacity:.4;cursor:default}
#mission{left:16px;top:62px;width:318px;background:rgba(10,16,36,.82);border:1px solid #b9964a;border-radius:10px;padding:10px 12px;display:none;font-size:14px;line-height:1.45}
#mission h3{font-size:16px;color:var(--gold);margin-bottom:5px}
#mission .tk{padding:3px 0 3px 22px;position:relative;opacity:.92}
#mission .tk:before{content:"○";position:absolute;left:2px;color:var(--gold)}
#mission .tk.d{color:#9fe0a0;text-decoration:line-through;opacity:.8}#mission .tk.d:before{content:"✔";color:#9fe0a0}
#panel{right:14px;top:62px;width:312px;max-height:640px;overflow:auto;background:rgba(10,16,36,.86);border:1px solid #b9964a;border-radius:10px;padding:10px 12px;display:none;font-size:14px;line-height:1.5}
.sl label{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}.sl b{color:var(--gold)}.sl input{width:100%;accent-color:var(--gold);height:26px}
.note{font-size:13px;line-height:1.5;padding:6px 8px;margin:5px 0;background:#ffffff10;border-radius:6px}.note.g{background:#3a5a2a55}.note.r{background:#6a2a2a66}
.row{display:flex;flex-wrap:wrap}
.num{display:flex;align-items:center;justify-content:space-between;margin:4px 0;font-size:14px}.num input{width:70px;padding:4px;font:inherit;background:#0006;color:var(--paper);border:1px solid #b9964a;border-radius:5px;text-align:center}
#tools{left:16px;bottom:14px;display:none;gap:4px}
#dlg{left:70px;right:70px;bottom:20px;height:190px;display:none;gap:16px;align-items:center;padding:10px 20px;background:linear-gradient(rgba(26,18,12,.96),rgba(44,30,16,.96));border:2px solid var(--gold);border-radius:14px;box-shadow:0 8px 40px #000c;cursor:pointer;z-index:20}
#dlg .pt{width:150px;height:170px;flex:none;margin-top:-34px;filter:drop-shadow(0 4px 8px #000a)}
#dlg .tx{flex:1;position:relative;height:100%}#dlg .nm{color:var(--gold);font-size:17px;margin-top:8px}
#dlg .ln{font-size:21px;line-height:1.55;margin-top:6px}#dlg .nx{position:absolute;right:4px;bottom:2px;font-size:13px;color:#cdbb8a}
#dlg .sk{margin-left:14px;text-decoration:underline;color:#9ab}
#modal{inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,12,.72);z-index:30}
#modal .box{width:820px;max-height:640px;overflow:auto;background:linear-gradient(#1c2342,#10162e);border:2px solid var(--gold);border-radius:14px;padding:22px 30px;font-size:17px;line-height:1.65;box-shadow:0 10px 60px #000}
#modal .gd{font-size:18px;line-height:1.75}#modal .gd ul,#modal .gd ol{padding-left:24px;margin:4px 0 8px}#modal .gd li{margin:6px 0}#modal .gd b{color:#ffe9a0}.ch{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-2px;border:1px solid #fff8}
#tour{position:absolute;inset:0;pointer-events:none;display:none;z-index:18}#tc{position:absolute;left:350px;width:580px;background:linear-gradient(#241808f4,#160f06f4);border:2px solid #ffd45a;border-radius:14px;padding:10px 16px 12px;pointer-events:auto;box-shadow:0 6px 30px #000}#tc h3{color:#ffd45a;font-size:21px;margin-top:4px}#tc p{font-size:18px;line-height:1.55;margin:4px 0 8px}.chip{display:inline-block;padding:3px 9px;margin:2px;border-radius:12px;background:#ffffff18;font-size:13px;cursor:pointer;border:1px solid #fff4}.chip.on{background:#ffd45a;color:#2a1a08;font-weight:700}
#modal h2{color:var(--gold);font-size:26px;margin-bottom:8px}#modal b{color:var(--celadon)}#modal p{margin:2px 0 10px}#modal .hs{color:#e8c98a}.mb{text-align:right;margin-top:8px}
#toast{left:50%;top:70px;transform:translateX(-50%);max-width:760px;padding:10px 20px;background:rgba(12,18,40,.94);border:1px solid var(--gold);border-radius:30px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;text-align:center}
.ttl{position:absolute;left:0;right:0;top:120px;text-align:center}
.ttl .sub{font-size:22px;letter-spacing:.3em;color:#cfe0f5;text-shadow:0 2px 12px #000}
.ttl h1{font-size:92px;font-weight:900;letter-spacing:.12em;color:var(--paper);text-shadow:0 0 30px #d9b45a88,0 4px 0 #6e4e12;margin:10px 0 0}
.ttl h2{font-size:34px;font-weight:400;letter-spacing:.35em;color:var(--gold);margin-bottom:46px}
.lb{position:absolute;width:250px;text-align:center;padding:12px;background:rgba(10,16,36,.84);border:2px solid var(--gold);border-radius:12px;cursor:pointer;transition:transform .15s}
.lb:hover{transform:scale(1.05)}.lb.lock{filter:grayscale(1) brightness(.6);cursor:not-allowed}.lb h4{color:var(--gold);font-size:19px}.lb p{font-size:14px;margin-top:2px}.lb .pg{margin-top:6px;font-size:15px;color:#9fe0a0}
.card{position:absolute;width:250px;text-align:center;padding:10px;background:rgba(10,16,36,.88);border:2px solid var(--gold);border-radius:12px;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-6px)}.card canvas{display:block;margin:0 auto 4px;background:#0006;border-radius:8px}.card h4{font-size:22px;color:var(--gold)}.card p{font-size:13px;color:#cfd8ee}.card .st{margin-top:4px;font-size:14px}
.rec{position:absolute;inset:50px 40px 30px 40px;background:rgba(8,12,28,.95);border:2px solid var(--gold);border-radius:14px;display:flex;gap:18px;padding:18px}
.rec .gl{width:330px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.rec .gi{background:#ffffff10;border:1px solid #7a6a3a;border-radius:10px;padding:6px;text-align:center;cursor:pointer;font-size:15px}.rec .gi.sel{outline:3px solid var(--gold)}.rec .gi.lk{opacity:.4}
.rec .dt{flex:1;overflow:auto;font-size:16px;line-height:1.65}.rec .dt h2{color:var(--gold);font-size:28px}.rec .dt b{color:var(--celadon)}.rec .dt p{margin:2px 0 10px}
.fin{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:30px;line-height:1.8;text-shadow:0 2px 14px #000}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="stage">
<canvas id="cv" width="1280" height="720"></canvas>
<div id="scr"></div><div id="top"></div><div id="mission"></div><div id="panel"></div><div id="tools"></div><div id="dlg"></div><div id="modal"></div><div id="toast"></div><div id="coach"></div><div id="tour"></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),TAU=Math.PI*2,R=Math.PI/180;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cv=$('#cv'),C=cv.getContext('2d'),W=1280,H=720;
let S={done:{},snd:true,seen:{}},T=0,scene={draw(){}},mdev=null,sims={};
const KEY='sejong_jang_save_v1';
function load(){try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function fit(){const b=document.body,s=Math.min(b.clientWidth/W,b.clientHeight/H);$('#stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();

/* ---------- 소리 ---------- */
let AC=null;
function ac(){if(!S.snd)return null;try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05)}
function bell(){tone(660,1.6,'sine',.25);tone(1320,1.2,'sine',.1);tone(1980,.8,'sine',.05)}
function drum(){tone(150,.4,'triangle',.45,0,45)}
function gong(){tone(220,1.8,'sawtooth',.06);tone(330,1.6,'sine',.12);tone(442,1.4,'sine',.06)}
function okS(){tone(660,.15,'sine',.14);tone(880,.28,'sine',.14,.12)}
function badS(){tone(190,.3,'square',.06)}
let musicT=null;
function music(on){clearInterval(musicT);musicT=null;if(!on)return;const N=[293.66,329.63,392,440,493.88,587.33],mel=[0,2,3,4,3,2,1,0,2,3,5,4,3,2,1,2],pad=[[146.8,220,293.7],[130.8,196,261.6],[110,164.8,220],[123.5,185,246.9]];let i=0;
 const play=()=>{if(!S.snd)return;tone(N[mel[i%16]],1.4,'sine',.13);if(i%4===0){pad[(i/4|0)%4].forEach(f=>tone(f,3.2,'triangle',.05))}i++};play();musicT=setInterval(play,700)}

/* ---------- UI 도우미 ---------- */
function mk(html,cls,par){const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;(par||document.body).appendChild(d);return d}
let toastT;function toast(t,ms){const e=$('#toast');e.innerHTML=t;e.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>e.style.opacity=0,ms||2800)}
function modal(html,btns){const m=$('#modal');m.style.display='flex';m.innerHTML='<div class="box">'+html+'<div class="mb"></div></div>';const mb=m.querySelector('.mb');(btns||[]).forEach(b=>{const e=document.createElement('button');e.className='btn '+(b[2]||'');e.innerHTML=b[0];e.onclick=b[1];mb.appendChild(e)})}
function closeModal(){$('#modal').style.display='none'}
let dq=[],dcb=null,di=0;
function say(lines,cb){dq=lines;dcb=cb;di=0;$('#dlg').style.display='flex';sayShow()}
function sayShow(){const l=dq[di];if(!l){$('#dlg').style.display='none';const f=dcb;dcb=null;if(f)f();return}
 $('#dlg').innerHTML='<div class="pt">'+portrait(l.w,l.e||'n')+'</div><div class="tx"><div class="nm">'+(l.w==='s'?'세종대왕':'장영실')+'</div><div class="ln">'+l.t+'</div><div class="nx">'+(di+1)+'/'+dq.length+' · 클릭하여 계속 ▶<span class="sk">건너뛰기</span></div></div>'}
$('#dlg').addEventListener('click',e=>{if(e.target.classList&&e.target.classList.contains('sk'))di=dq.length;else di++;sayShow()});
const hintSay=t=>say([{w:'j',e:'think',t}]);

/* ---------- 인물(세종·장영실) : 외형 고정 ---------- */
function portrait(w,e){
 const eye=e==='smile'?'<path d="M60 79q8-8 16 0M94 79q8-8 16 0" stroke="#2a1a12" stroke-width="3.2" fill="none" stroke-linecap="round"/>':e==='surprise'?'<circle cx="68" cy="79" r="6.5" fill="#fff"/><circle cx="102" cy="79" r="6.5" fill="#fff"/><circle cx="68" cy="79" r="3.4" fill="#2a1a12"/><circle cx="102" cy="79" r="3.4" fill="#2a1a12"/>':'<ellipse cx="68" cy="79" rx="6.5" ry="3.8" fill="#fff"/><ellipse cx="102" cy="79" rx="6.5" ry="3.8" fill="#fff"/><circle cx="68" cy="79" r="2.8" fill="#2a1a12"/><circle cx="102" cy="79" r="2.8" fill="#2a1a12"/>';
 const brow=e==='think'?'<path d="M57 68l17-5M96 63l17 5" stroke="#2a1a12" stroke-width="3.4" fill="none" stroke-linecap="round"/>':e==='surprise'?'<path d="M58 64q10-8 18-1M94 63q8-7 18 1" stroke="#2a1a12" stroke-width="3" fill="none" stroke-linecap="round"/>':'<path d="M58 67q10-5 18-1M94 66q8-4 18 1" stroke="#2a1a12" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
 const mouth=e==='smile'?'<path d="M71 104q14 13 28 0" stroke="#7a2a22" stroke-width="3.2" fill="#a8433a" stroke-linecap="round"/>':e==='surprise'?'<ellipse cx="85" cy="107" rx="5.5" ry="7" fill="#7a2a22"/>':e==='think'?'<path d="M76 107h18" stroke="#7a2a22" stroke-width="3.2" stroke-linecap="round"/>':'<path d="M74 106q11 5 22 0" stroke="#7a2a22" stroke-width="3.2" fill="none" stroke-linecap="round"/>';
 let body,hat,hair='';
 if(w==='s'){
  body='<path d="M10 190Q16 126 58 120L112 120Q154 126 160 190Z" fill="#a8231f"/><path d="M62 120L85 152L108 120Z" fill="#f4efe0"/><circle cx="85" cy="168" r="15" fill="none" stroke="#d9b45a" stroke-width="3"/><path d="M78 168q7-10 14 0q-7 10-14 0" fill="#d9b45a"/><rect x="20" y="150" width="130" height="5" fill="#d9b45a" opacity=".5"/>';
  hat='<path d="M50 60Q85 10 120 60L113 64Q85 34 57 64Z" fill="#15131a"/><path d="M118 44q26-30 32-6q-8 16-28 20Z M52 44q-26-30-32-6q8 16 28 20Z" fill="#15131a"/><path d="M52 62Q85 40 118 62" stroke="#d9b45a" stroke-width="2.5" fill="none"/>';
  hair='<path d="M58 98Q85 152 112 98Q98 122 85 124Q72 122 58 98Z" fill="#3a3238"/><path d="M68 100Q85 93 102 100Q85 106 68 100Z" fill="#3a3238"/>';
 }else{
  body='<path d="M10 190Q16 126 58 120L112 120Q154 126 160 190Z" fill="#2b4a73"/><path d="M62 120L85 154L108 120Z" fill="#e8e4d2"/><path d="M85 154v36" stroke="#1a2f4f" stroke-width="3"/><circle cx="85" cy="150" r="3" fill="#d9b45a"/>';
  hat='<path d="M52 66Q85 14 118 66L118 74Q85 60 52 74Z" fill="#3a2a1a"/><path d="M52 70Q85 58 118 70" stroke="#8a6a3a" stroke-width="3" fill="none"/>';
  hair='<path d="M72 101Q85 96 98 101Q85 105 72 101Z" fill="#5a4a40"/><path d="M80 120q5 14 10 0" stroke="#5a4a40" stroke-width="3" fill="none"/>';
 }
 return '<svg viewBox="0 0 170 190" xmlns="http://www.w3.org/2000/svg">'+body+'<rect x="75" y="104" width="20" height="20" fill="#e2b78c"/><ellipse cx="85" cy="80" rx="35" ry="41" fill="#f0cba5"/><ellipse cx="50" cy="82" rx="5" ry="10" fill="#e6b98f"/><ellipse cx="120" cy="82" rx="5" ry="10" fill="#e6b98f"/>'+hat+eye+brow+'<path d="M85 84v12" stroke="#c9996e" stroke-width="2.5" stroke-linecap="round"/>'+mouth+hair+'</svg>'}

/* ---------- 데이터 ---------- */
const STARS=[['북극성',37.95,89.26],['직녀성',279.23,38.78],['견우성',297.7,8.87],['천랑성',101.29,-16.72],['대화성',247.35,-26.43]];
const JG=['춘분','청명','곡우','입하','소만','망종','하지','소서','대서','입추','처서','백로','추분','한로','상강','입동','소설','대설','동지','소한','대한','입춘','우수','경칩'];
const LATD=37.5,LAT=LATD*R,EPS=23.44*R;
const DECL=i=>Math.asin(Math.sin(EPS)*Math.sin(i*15*R))/R;
function EQV(Hd,dd){const Hh=Hd*R,d=dd*R;return[-Math.cos(d)*Math.sin(Hh),Math.sin(d)*Math.cos(LAT)-Math.cos(d)*Math.cos(Hh)*Math.sin(LAT),Math.sin(d)*Math.sin(LAT)+Math.cos(d)*Math.cos(Hh)*Math.cos(LAT)]}
const SUNV=(i,hr)=>EQV((hr-12)*15,DECL(i));
const DEV=[
{id:'hon',kid:'혼천의는 둥근 고리 여러 개로 별이 있는 방향을 가리키는 하늘 지도 도구예요. 별의 방향을 각도 숫자로 알려 줘요.',go:'오른쪽 슬라이더 두 개(사유환, 규형)를 움직여 흰 막대 끝을 금빛 별 쪽으로 향하게 해요. 별에 가까워지면 아래에 알려 줄게요!',n:'혼천의',h:'渾天儀',lab:1,
 intro:[{w:'s',e:'n',t:'하늘의 움직임을 알아야 백성에게 때를 알려 줄 수 있느니라. 여기 혼천의를 보거라.'},{w:'j',e:'smile',t:'혼천의는 여러 개의 고리로 이루어져 있어요. 고리마다 맡은 일이 달라서, 직접 돌려 보면 하늘의 좌표가 눈에 들어올 거예요!'}],
 hist:'혼천의는 세종 때(1433년 무렵) 정초·이천 등이 중심이 되어 만든 천문 관측 기구로 전해집니다. 장영실도 이 시기 천문 기구 제작 사업에 참여한 것으로 알려져 있지만, 장영실 혼자 만든 발명품은 아니에요. 여러 학자와 기술자가 함께한 국가 사업이었습니다.',
 use:'천체의 위치와 움직임을 관측하고, 하늘의 좌표를 이해하는 기구',
 how:'여러 고리가 각각 지평·남북선·적도 같은 기준 방향을 나타내요. 사유환을 돌려 적경(입수도)을 맞추고, 규형(관측통)을 기울여 적위(거극도)를 맞추면 별 쪽을 정확히 가리킬 수 있어요.',
 help:'별의 위치를 숫자로 기록할 수 있게 되어, 달력(역법)을 만들고 농사 때를 알리는 데 쓰였어요.',

ang:[
['🕐 앙부일구는 뭐예요?',`<p>이름을 풀면 <b>앙(올려다보다) + 부(솥) + 일구(해시계)</b>, 곧 <b>하늘을 올려다보는 솥 모양 해시계</b>예요. 솥처럼 오목한 그릇 안쪽에 그림자가 생겨요.</p><p>글자를 몰라도 <b>그림자가 닿은 선만 보면 시각을 알 수 있게</b> 만들어서, 사람이 많은 길가에 두었어요.</p>`],
['🔧 부품 소개',`<ul><li>${CH('#caa66a')}<b>오목한 반구(솥)</b> : 둥글게 파인 그릇이에요. 그림자가 이 안쪽 면에 생겨요.</li><li>${CH('#d9b45a')}<b>영침</b> (금색 바늘) : 그릇 가운데를 가로지르는 막대예요. <b>북극성 쪽</b>을 향해 비스듬히 세워져 있어요. 이 바늘의 <b>그림자 끝</b>(검은 점)이 시각을 알려 줘요.</li><li>${CH('#6e1a14')}<b>시각선</b> (세로로 그어진 선) : 한 시간(15°)마다 한 줄이에요. 선 옆에 시각이 써 있어요. 子·丑·寅 같은 한자는 옛날 시간 이름(12지)이에요. 午는 낮 12시쯤이에요.</li><li>${CH('#7a3a1a')}<b>절기선</b> (가로로 둥근 선) : 계절을 알려 줘요. <b>하지선</b>은 영침 쪽에 가깝고, <b>동지선</b>은 가장 멀어요. 가운데 붉은 선이 <b>춘분·추분선</b>이에요.</li></ul>`],

ja:[
['⏳ 자격루는 뭐예요?',`<p>자격루는 <b>물로 시간을 재는 자동 물시계</b>예요. 이름이 <b>스스로(자) 친다(격)</b>는 뜻이라서, 정해진 시각이 되면 <b>인형이 스스로 종·북·징을 쳐서</b> 시각을 알려 줘요.</p><p>해가 안 보이는 밤이나 흐린 날에도 시간을 알 수 있어요. 이 게임에서는 <b>정확한 시각에 종이 울리게</b> 만드는 게 목표예요!</p>`],
['🔧 부품 ① 물 항아리들 (왼쪽 3개)',`<ul><li>${CH('#6fb4e8')}<b>대파수호 · 중파수호 · 소파수호</b> : 위에서 아래로 계단처럼 놓인 큰 항아리 3개예요. 물이 위에서 아래로 차례로 흘러내려요.</li><li><b>왜 3개나 있을까요?</b> 맨 위 항아리의 물이 줄면 흐르는 힘이 약해져요. 그래서 <b>아래 항아리를 거쳐 물 높이를 일정하게 만드는 것</b>이에요. 물총을 가득 채웠을 때와 조금 남았을 때 물줄기 세기가 다른 것과 같아요.</li><li>${CH('#9fe0a0')}<b>정수위(초록 점선)</b> : 알맞은 물 높이예요. 소파수호는 이 높이가 되면 넘치는 물을 따로 빼요(넘치는 물 관). 그러면 물 높이가 늘 같아서 <b>흐르는 속도도 일정</b>해요.</li></ul>`],
['🔧 부품 ② 수수호와 시보 장치',`<ul><li>${CH('#6fb4e8')}<b>수수호</b> (가운데 길쭉한 통) : 물을 받는 통이에요. 물이 차오를수록 높이가 올라가요. 옆 눈금은 0~100이에요.</li><li>${CH('#e0b95a')}<b>잣대(살대)</b> : 수수호 물에 <b>둥둥 뜨는 막대</b>예요. 물이 차면 같이 올라가요.</li><li>${CH('#d9b45a')}<b>지렛대</b> : 잣대가 맨 위(100)에 닿으면 기울어져서 구슬을 풀어 줘요.</li><li>⚫<b>구슬</b> : 굴러가며 인형들을 차례로 건드려요.</li><li>🔔<b>종·북·징 인형</b> : 구슬이 닿으면 팔을 휘둘러 종, 북, 징을 쳐요. 소리로 시각을 알려 줘요.</li><li>🎚<b>밸브</b> (오른쪽 슬라이더) : 수수호로 들어가는 <b>물의 양</b>을 조절해요. 열수록 물이 빨리 차올라 종이 빨리 울려요.</li></ul>`],
['🎮 이렇게 조작해요',`<ol><li><b>1단계 물 채우기</b> : <b>🪣 대파수호 물 채우기</b>를 눌러요. 물이 아래 항아리로 내려가 <b>소파수호가 초록 점선</b>까지 차면 성공!</li><li><b>2단계 시각 맞추기</b> : <b>밸브</b>를 정하고 <b>⏱ 시보 시작</b>을 눌러요. 살대가 100에 닿는 순간 종이 울려요.</li><li>목표는 <b>20초 뒤에 종이 울리게</b> 하는 거예요(±3초 OK). 화면의 <b>"약 몇 초 뒤"</b> 계산이 도와줘요. 밸브를 줄이면 느려지고, 늘리면 빨라져요.</li></ol><p>🔍 <b>실제 vs 연출</b> : 진짜 자격루는 더 많은 항아리와 정교한 장치로 이루어졌어요. 이 게임은 원리를 쉽게 보려고 단순하게 표현했어요.</p>`]],
il:[
['☀🌙 일성정시의는 뭐예요?',`<p>이름은 <b>일(해) + 성(별) + 정시(시각을 정함) + 의(기구)</b>예요. <b>낮에는 해, 밤에는 별</b>을 겨눠서 시각을 알아내는 <b>하늘 시계</b>예요.</p><p>해도 별도 하루에 한 바퀴(360°)씩 돌아요. 그래서 <b>천체의 각도 = 시각</b>이에요!</p>`],
['🔧 부품 소개 (화면의 둥근 시계)',`<ul><li>${CH('#8a5a30')}<b>주천도분환</b> (바깥 갈색 고리) : 각도(°) 눈금이 새겨진 고리예요. 한 바퀴 360°예요.</li><li>${CH('#f3ead2')}<b>시각환</b> (하얀 고리) : 1~24시 숫자가 써 있어요. <b>돌릴 수 있어요</b>(밤에 보정할 때 써요). 맨 위가 정오(12시)예요.</li><li>${CH('#efe6c6')}<b>규형(관측통)</b> (가운데서 뻗은 막대) : 해나 별 쪽으로 돌려요. 끝에 작은 구멍이 있어서 <b>빛이 구멍을 통과하면 맞은 거예요</b>.</li><li>🔴<b>빨간 삼각형</b> : 지금 시각환에서 읽는 위치를 가리켜요.</li><li><b>가운데 글자</b> : 지금 시각이에요.</li></ul>`],
['☀ 낮 원리',`<p>해는 <b>1시간에 15°</b>씩 돌아요 (360° ÷ 24시간). 정오에는 맨 위에 있고, 오전에는 왼쪽, 오후에는 오른쪽으로 이동해요.</p><p>👉 <b>관측통을 해 쪽으로 돌린 각도 ÷ 15 = 정오에서 몇 시간 떨어졌나</b>! 시각환이 계산해서 보여 주니, 해를 맞추고 시각을 읽기만 하면 돼요.</p>`],
['🌙 밤 원리 (조금 어려워요!)',`<p>별도 하루에 한 바퀴 돌지만, 별은 <b>날짜에 따라 출발 위치가 달라져요</b>. 그래서 밤에는 눈금판(시각환)을 <b>날짜에 맞게 돌려서 보정</b>해야 해요.</p><ul><li><b>적경</b> : 하늘의 <b>가로 위치</b>예요 (혼천의 설명서 참고). 별마다, 그리고 계절마다 태양마다 달라요.</li><li><b>보정각</b> = <b>태양의 적경 − 별의 적경</b> (음수면 360°를 더해요).</li></ul><p>게임에서 <b>별의 적경</b>과 <b>오늘 태양의 적경</b>을 알려 줘요. 계산이 어려우면 <b>🤝 도움</b> 버튼이 맞춰 줘요. 화면 아래 안내 글에서도 보정각을 알려 줘요!</p>`],
['🎮 이렇게 조작해요',`<ol><li><b>낮</b> : 관측통을 해 쪽으로 돌려요(화면 드래그 또는 슬라이더). 빛이 통과하면 가운데 시각을 확인하고 <b>📝 시각 기록</b>!</li><li><b>밤</b> : 별 쪽으로 돌린 뒤, <b>시각환 보정</b> 슬라이더를 보정각 근처로 돌려요. 그다음 <b>📝 시각 기록</b>!</li></ol>`]],
chu:[
['🌧 측우기는 뭐예요?',`<p>측우기는 <b>비가 얼마나 왔는지</b> 재는 <b>빗물 받이 통</b>이에요. 같은 모양, 같은 크기의 통에 비를 받으면 <b>물의 높이</b>가 곧 <b>비의 양(강수량)</b>이에요. 통이 모두 같기 때문에 <b>지역끼리 비교</b>할 수 있어요.</p>`],
['📍 어려운 말',`<ul><li><b>강수량</b> : 내린 비의 양이에요. 통에 고인 <b>물의 높이</b>(mm)로 나타내요.</li><li><b>mm(밀리미터)</b> : 1cm의 10분의 1이에요. 10mm = 1cm. 비가 30mm 왔다 = 통에 3cm 높이로 물이 찼다.</li><li><b>비의 세기</b> : 1시간에 몇 mm가 오는가예요 (mm/시).</li><li><b>강수량 = 비의 세기 × 비가 온 시간</b> (예: 10mm/시 × 3시간 = 30mm)</li><li><b>촌·푼</b> : 옛날 길이 단위예요 (1촌=10푼). 옛 사람들은 이 단위로 기록했어요.</li></ul>`],
['🔧 부품 소개',`<ul><li>${CH('#6a6a72')}<b>측우기 통</b> : 원통 모양 그릇이에요. 투명하게 그려서 물이 보여요.</li><li>${CH('#fff')}<b>눈금</b> : 통 옆에 10mm마다 숫자가 있어요. 물 표면에서 점선이 눈금까지 이어져요.</li><li>${CH('#8a8a92')}<b>측우대</b> : 통을 올려 두는 돌받침이에요. 바닥이 평평해야 정확해요.</li><li>☁<b>구름과 빗방울</b> : 비의 세기가 클수록 빗방울이 많아요.</li></ul>`],
['🎮 이렇게 조작해요',`<ol><li><b>☔ 6시간 동안 비 내리기</b>를 눌러요. 세 지역(한양·평양·동래)에 서로 다른 비가 와요.</li><li>비가 그치면 각 통의 <b>물 표면 눈금 숫자</b>를 읽어 칸에 적고 <b>✅ 측정값 확인</b>!</li><li>다음엔 <b>가장 비가 많이 온 지역</b>을 골라요.</li><li>마지막은 <b>직접 만들기</b> : 비의 세기와 시간을 정해서 목표 mm를 맞춰 보아요.</li></ol>`]],
su:[
['🌊 수표는 뭐예요?',`<p>수표는 <b>강물 속에 세운 눈금 기둥</b>이에요. 물이 <b>눈금의 어디까지</b> 올라왔는지 보고 <b>홍수가 날지 미리</b> 알 수 있어요. 비가 많이 오면 물이 불어나니까, 수표를 보면서 사람들에게 미리 알려요.</p>`],
['🔧 부품 소개',`<ul><li>${CH('#b8b0a0')}<b>수표 기둥</b> (가운데 돌기둥) : 강 한가운데 세워진 눈금 기둥이에요. 숫자는 <b>척(尺)</b>이라는 옛 길이 단위예요. (게임 속 눈금)</li><li>${CH('#ffd45a')}<b>주의선 6척</b> (노란 점선) : 물이 여기까지 오면 조심해야 해요.</li><li>${CH('#ff4a3a')}<b>위험선 9척</b> (빨간 점선) : 홍수 위험! 사람들을 대피시켜야 해요.</li><li>${CH('#ff2a2a')}<b>범람 10척</b> : 물이 둑을 넘쳐 마을로 들어와요.</li><li>🔼<b>초록/노란 화살표</b> : 지금 수위를 가리켜요.</li><li>🚪<b>수문</b> : 강물을 빼내는 문이에요. 더 열수록 물이 빨리 빠져요. 하지만 너무 열면 아래 마을이 잠겨요!</li></ul>`],
['🎮 이렇게 조작해요',`<ol><li><b>탐구</b> : 비의 양 슬라이더를 올려 물이 불어나 <b>빨간 선</b>을 넘는 모습을 봐요.</li><li><b>수위 판단</b> : 폭풍우 중 질문이 나와요. 눈금을 보고 6척 미만은 <b>안전</b>, 6~9척은 <b>주의</b>, 9척 이상은 <b>위험</b>을 골라요.</li><li><b>홍수 막기</b> : 수문 슬라이더를 1.6~2.0쯤으로 열어 30초 동안 9척을 넘지 않게 해요!</li></ol>`]]};
DEV.forEach(d=>d.guide=GUIDE[d.id]);
function showGuide(id,cb){const d=DEVm[id],pg=d.guide.concat([['📜 역사 확인',`<p>${d.hist}</p><p>💡 <b>쉽게 말하면</b> ${d.kid}</p>`]]);let i=0;
 function render(){const p=pg[i];const btns=[];if(i>0)btns.push(['◀ 이전',()=>{i--;render()},'sec']);btns.push(['건너뛰기',()=>{closeModal();cb&&cb()},'sec']);
  btns.push(i<pg.length-1?['다음 ▶',()=>{i++;render()}]:['🎮 시작하기!',()=>{closeModal();cb&&cb()},'red']);
  modal('<div style="font-size:14px;color:#9ab">'+d.n+' 설명서 · '+(i+1)+' / '+pg.length+'</div><h2>'+p[0]+'</h2><div class="gd">'+p[1]+'</div>',btns);$('#modal .box').scrollTop=0}
 render()}

/* ================= 시뮬레이션 투어: 실제 화면을 가리키며 설명 ================= */
let tour=null;
function domRect(el){const sr=$('#stage').getBoundingClientRect(),r=el.getBoundingClientRect(),k=sr.width/W;return{x:(r.left-sr.left)/k,y:(r.top-sr.top)/k,w:r.width/k,h:r.height/k}}
const PNL=i=>()=>{const e=document.querySelectorAll('#panel input[type=range]')[i];return e?domRect(e.parentElement):null};
const PNLALL=()=>domRect($('#panel'));
function startTour(id,cb,noinit){const sm=sims[id];if(!sm||!sm.tour){cb&&cb();return}
 if(!noinit)sm.init();closeModal();$('#dlg').style.display='none';
 tour={id,steps:sm.tour(),i:0,cb,t0:T};
 const o=$('#tour');o.style.display='block';
 o.innerHTML='<svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;left:0;top:0"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffd45a"/></marker></defs><line id="tl" stroke="#ffd45a" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ah)"/><circle id="tcir" fill="rgba(255,212,90,.12)" stroke="#ffd45a" stroke-width="5"/><rect id="trc" rx="10" fill="rgba(255,212,90,.12)" stroke="#ffd45a" stroke-width="5"/><g id="tlb"><rect rx="8" fill="#ffd45a" height="30"/><text font-size="18" font-weight="800" fill="#2a1a08" text-anchor="middle" font-family="inherit"></text></g></svg><div id="tc"></div>';
 gotoStep(0)}
function gotoStep(i){tour.i=i;tour.t0=T;const s=tour.steps[i],n=tour.steps.length;if(s.on)s.on();
 const chips=tour.steps.map((x,k)=>'<span class="chip'+(k===i?' on':'')+'" data-k="'+k+'">'+x.chip+'</span>').join('');
 $('#tc').innerHTML='<div style="font-size:13px;color:#cdb">👆 보고 싶은 부품을 눌러 보세요 ('+(i+1)+'/'+n+')</div><div>'+chips+'</div><h3>'+s.h+'</h3><p>'+s.t+'</p><div style="text-align:right" id="tcb"></div>';
 const tb=$('#tcb');pbtn('📖 글로 보기',()=>showGuide(tour.id),'sec sm',tb);if(i>0)pbtn('◀ 이전',()=>gotoStep(i-1),'sec sm',tb);
 pbtn(i<n-1?'다음 ▶':'🎮 직접 해 보기!',()=>{i<n-1?gotoStep(i+1):endTour()},i<n-1?'':'red',tb);pbtn('✖ 끝내기',endTour,'sec sm',tb);
 $('#tc').querySelectorAll('.chip').forEach(c=>c.onclick=()=>gotoStep(+c.dataset.k))}
function endTour(){if(!tour)return;const t=tour;tour=null;const o=$('#tour');o.style.display='none';o.innerHTML='';sims[t.id].init();t.cb&&t.cb()}
function updTour(){if(!tour)return;const s=tour.steps[tour.i];if(!s)return;try{s.dm&&s.dm(T-tour.t0)}catch(e){}
 let a=null;try{a=s.at&&s.at()}catch(e){}if(!a)a={x:640,y:360,r:6};
 const cir=$('#tcir'),rc=$('#trc'),tc=$('#tc'),ln=$('#tl'),lb=$('#tlb');if(!cir)return;
 let cx,cy,top,bot,rad;
 if(a.w){rc.style.display='';cir.style.display='none';rc.setAttribute('x',a.x);rc.setAttribute('y',a.y);rc.setAttribute('width',a.w);rc.setAttribute('height',a.h);cx=a.x+a.w/2;cy=a.y+a.h/2;top=a.y;bot=a.y+a.h;rad=Math.min(a.w,a.h)/2}
 else{const r=a.r+3*Math.sin(T*5);cir.style.display='';rc.style.display='none';cir.setAttribute('cx',a.x);cir.setAttribute('cy',a.y);cir.setAttribute('r',r);cx=a.x;cy=a.y;top=a.y-a.r;bot=a.y+a.r;rad=a.r}
 const atBottom=cy<390;tc.style.top=atBottom?'auto':'66px';tc.style.bottom=atBottom?'12px':'auto';
 const th=tc.offsetHeight,ay=atBottom?720-12-th:66+th,ax=cl(cx,390,890);
 if(s.big){ln.style.display='none'}else{const dx=cx-ax,dy=cy-ay,d=Math.hypot(dx,dy)||1;if(d<rad+30){ln.style.display='none'}else{ln.style.display='';ln.setAttribute('x1',ax);ln.setAttribute('y1',ay);ln.setAttribute('x2',cx-dx/d*(rad+10));ln.setAttribute('y2',cy-dy/d*(rad+10))}}
 const label=s.lab||s.chip,lw=label.length*18+26,lx=cl(cx-lw/2,8,1272-lw);let ly=top-44;if(ly<64)ly=bot+14;if(ly>684)ly=top-44;
 const rr=lb.querySelector('rect'),tx=lb.querySelector('text');rr.setAttribute('x',lx);rr.setAttribute('y',ly);rr.setAttribute('width',lw);tx.setAttribute('x',lx+lw/2);tx.setAttribute('y',ly+22);tx.textContent=label}

/* ================= 3D 도우미 ================= */
let V={yaw:.5,pitch:.4,cx:540,cy:405,s:220};
function P3(p){const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);const x1=p[0]*cy+p[2]*sy,z1=-p[0]*sy+p[2]*cy;return[V.cx+V.s*x1,V.cy-V.s*(p[1]*cp-z1*sp),p[1]*sp+z1*cp]}
function ringD(pts,col,lw,glow){const q=pts.map(P3);C.lineCap='round';
